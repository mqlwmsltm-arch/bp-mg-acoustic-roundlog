<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#880e4f"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1218" cy="78" r="49" fill="#880e4f" opacity="0.19"/>
    <circle cx="356" cy="548" r="22" fill="#880e4f" opacity="0.19"/>
    <circle cx="1277" cy="639" r="82" fill="#880e4f" opacity="0.20"/>
    <circle cx="272" cy="482" r="70" fill="#880e4f" opacity="0.15"/>
    <circle cx="1261" cy="341" r="39" fill="#880e4f" opacity="0.17"/>
    <circle cx="318" cy="-95" r="42" fill="#880e4f" opacity="0.06"/>
    <rect x="1121" y="291" width="34" height="53" rx="8" fill="#b71c1c" opacity="0.14" transform="rotate(0, 739, 191)"/>
    <rect x="-28" y="215" width="77" height="32" rx="8" fill="#b71c1c" opacity="0.08" transform="rotate(8, 1112, 60)"/>
    <rect x="611" y="526" width="39" height="63" rx="8" fill="#b71c1c" opacity="0.14" transform="rotate(25, 1008, 322)"/>
    <rect x="919" y="99" width="80" height="78" rx="8" fill="#b71c1c" opacity="0.09" transform="rotate(44, 897, 255)"/>
    <rect x="918" y="691" width="85" height="94" rx="8" fill="#b71c1c" opacity="0.14" transform="rotate(38, 939, 197)"/>
    <rect x="71" y="-93" width="24" height="49" rx="8" fill="#b71c1c" opacity="0.12" transform="rotate(1, 397, 631)"/>
    <rect x="184" y="182" width="55" height="79" rx="8" fill="#b71c1c" opacity="0.06" transform="rotate(4, 561, 478)"/>
    <rect x="1285" y="552" width="94" height="36" rx="8" fill="#b71c1c" opacity="0.15" transform="rotate(30, 379, 189)"/>
    <polygon points="1040,-51 1123,115 957,115" fill="#880e4f" opacity="0.03"/>
    <polygon points="604,201 656,305 552,305" fill="#880e4f" opacity="0.04"/>
    <polygon points="8,419 33,469 -17,469" fill="#880e4f" opacity="0.06"/>
    <polygon points="267,204 315,300 219,300" fill="#880e4f" opacity="0.03"/>

  <!-- Wave at bottom -->
  <path d="M0,586 C360,608 840,564 1200,586 L1200,630 L0,630Z" fill="#880e4f" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    마포 코인노래방 방음 시설 비교 가이드
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — 소음 진동 저감
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#ffd600" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#ffd600" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     마포 코인노래방 방음 시설 비교 가이드 — 소음 진동 저감
  </text>
</svg>